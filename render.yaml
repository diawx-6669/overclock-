# Развёртывание Fraud Hunter на Render одним сервисом:
# FastAPI отдаёт и API, и фронтенд.
#
# Данные и модель не хранятся в репозитории — они генерируются и обучаются
# на этапе сборки. Так репозиторий остаётся лёгким, а модель всегда
# соответствует текущему коду признаков.
services:
  - type: web
    name: fraud-hunter
    runtime: python
    plan: free
    region: frankfurt
    # Ветка указана явно: иначе Blueprint берёт ветку по умолчанию, и при
    # любой её смене деплой молча уезжает не туда
    branch: claude/beautiful-feynman-kxdobj
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python -m ml.generate_data
      python -m ml.train
      # Отчёт для вкладки «Модель» — приятное дополнение, а не условие работы
      # сайта. Если он не соберётся (например, не хватит памяти на free-тарифе),
      # деплой обязан продолжиться: API отдаст пустой отчёт, вкладка честно
      # скажет, что данных нет, всё остальное будет работать.
      python -m ml.report || echo "ОТЧЁТ НЕ СОБРАН — сайт поднимется без вкладки «Модель»"
      python -m ml.bench || echo "ЗАМЕР ЗАДЕРЖКИ НЕ ВЫПОЛНЕН — не критично"
      python -m ml.drift || echo "МОНИТОРИНГ ДРЕЙФА НЕ ВЫПОЛНЕН — не критично"
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONUNBUFFERED
        value: "1"
