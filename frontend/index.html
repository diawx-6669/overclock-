<style>
  /* ------------------------------------------------------------------
     Дизайн-решение: консоль, в которой цвет есть только у решений.

     Антифрод-оператор смотрит в этот экран весь день и ищет глазами одно —
     что система решила сделать. Если интерфейс расцвечен синими кнопками,
     фиолетовыми графиками и цветными акцентами, четыре цвета решений тонут
     в этом шуме. Поэтому вся обвязка монохромная: холодный графит, оттенки
     серого, волосяные линии. Насыщенный цвет в макете ровно один раз — на
     действии. Куда смотреть, понятно без объяснений.

     Шрифты подобраны под предметную область, а не по привычке. IBM Plex Sans
     и Plex Mono рисовались для корпоративных интерфейсов с плотными
     таблицами; Archivo даёт заголовкам характер, которого у гротесков по
     умолчанию нет. Все цифры — моноширинные с табличными знаками, иначе
     колонки сумм не выстраиваются и таблицу невозможно читать по вертикали.
     ------------------------------------------------------------------ */
  :root{
    color-scheme: dark;

    /* Холст: графит с холодным уклоном, а не нейтральный серый */
    --bg:#0a0c10;
    --panel:#111419;
    --panel2:#0d1015;
    --line:#1d222b;
    --line-soft:#171b22;

    --text:#e8eaee;
    --muted:#8b93a1;
    --dim:#5a6270;

    /* Единственные насыщенные цвета в макете — четыре действия */
    --allow:#3fb950;
    --stepup:#d29922;
    --hold:#db6d28;
    --block:#e5484d;

    /* «Акцент» намеренно почти бесцветный: он структурирует, но не спорит */
    --accent:#7d8695;
    --accent-soft:rgba(125,134,149,.14);

    /* Цвет данных. Не бренд и не акцент: холодный ненасыщенный серо-синий,
       который читается как чернила графика и не спорит с цветом решений.
       Насыщенный синий на его месте превращал бы каждый столбик в объект,
       требующий внимания, — а внимания заслуживает только действие. */
    --data:#8697b5;
    --data-dim:#5a6781;
    --data-strong:#b6c2d6;
    --data-fill:rgba(134,151,181,.42);
    --data-wash:rgba(134,151,181,.07);

    --r:10px;
    --r-lg:14px;
    --font:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --font-display:"Archivo","IBM Plex Sans",-apple-system,sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font:15px/1.55 var(--font);
    -webkit-font-smoothing:antialiased;
    font-feature-settings:"tnum" 0;
  }
  a{color:var(--text);text-underline-offset:3px}
  .wrap{max-width:1340px;margin:0 auto;padding:0 24px 72px}

  /* ---------- шапка ---------- */
  header{
    position:sticky;top:env(safe-area-inset-top, 0px);z-index:50;
    background:rgba(10,12,16,.92);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .head{max-width:1340px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .logo{
    display:flex;align-items:center;gap:10px;font-family:var(--font-display);
    font-weight:700;font-size:17px;letter-spacing:-.3px;
  }
  /* Фирменный знак. Он бирюзовый — это пятый цвет на монохромном экране,
     и появляется он ровно один раз, в углу шапки. С четырьмя цветами решений
     (зелёный, янтарный, оранжевый, красный) бирюза не спорит: она холодная и
     не читается как действие, поэтому правило «цвет только у решений»
     остаётся в силе. */
  .logo .mark{
    width:24px;height:24px;display:block;flex:0 0 24px;
  }
  .tagline{color:var(--dim);font-size:12.5px;font-weight:400}
  @media (max-width:1300px){ .tagline{display:none} }
  nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
  nav button{
    background:transparent;border:0;color:var(--muted);
    padding:7px 11px;border-radius:7px;cursor:pointer;font:500 13.5px var(--font);
    white-space:nowrap;position:relative;
  }
  nav button:hover{color:var(--text)}
  nav button.on{color:var(--text);background:var(--panel)}
  nav button.on::after{
    content:"";position:absolute;left:11px;right:11px;bottom:2px;height:1.5px;
    background:var(--text);border-radius:1px;
  }
  .langs{display:flex;gap:1px;border:1px solid var(--line);border-radius:7px;padding:2px}
  .langs button{
    background:transparent;border:0;color:var(--dim);padding:4px 9px;border-radius:5px;
    cursor:pointer;font:600 11.5px var(--font-mono);letter-spacing:.3px;
  }
  .langs button.on{background:var(--text);color:var(--bg)}

  /* ---------- типографика ---------- */
  h1,h2,h3{font-family:var(--font-display);letter-spacing:-.4px}
  h2{font-size:20px;margin:36px 0 5px;font-weight:600}
  h3{font-size:14.5px;margin:0 0 11px;font-weight:600;letter-spacing:-.2px}
  .sub{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 16px;max-width:76ch}
  .mono,.num,td.num,.kpi .v,.pill b{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

  /* ---------- поверхности ----------
     Рамка, заливка и тень тратятся по роли, а не наносятся на каждый блок:
     иначе всё выглядит одинаково важным и иерархия пропадает. */
  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:20px 22px;min-width:0;
  }
  .grid{display:grid;gap:14px}
  .grid > *{min-width:0}
  .hide{display:none !important}
  .muted{color:var(--muted)} .dim{color:var(--dim)}

  /* ---------- обложка ---------- */
  .hero{padding:34px 0 28px;border-bottom:1px solid var(--line)}
  .eyebrow{
    font:600 11px var(--font-mono);letter-spacing:1.4px;text-transform:uppercase;
    color:var(--dim);margin-bottom:16px;display:flex;align-items:center;gap:9px;
  }
  .eyebrow::after{content:"";flex:1;height:1px;background:var(--line);max-width:220px}
  .hero h1{
    font-size:clamp(25px,3.5vw,40px);line-height:1.12;margin:0 0 16px;
    letter-spacing:-1.2px;font-weight:700;text-wrap:balance;max-width:24ch;
  }
  .hero h1 em{font-style:normal;color:var(--hold)}
  .hero p.lead{color:var(--muted);font-size:14.5px;line-height:1.65;margin:0;max-width:64ch}
  .pills{display:flex;gap:26px;flex-wrap:wrap;margin:26px 0 0}
  .pill{display:flex;flex-direction:column;gap:3px}
  .pill b{font-size:21px;font-weight:600;color:var(--text);letter-spacing:-.5px}
  .pill span{font-size:11.5px;color:var(--dim)}
  .pill .d{display:none}

  /* живая лента в обложке */
  .tick{margin-top:28px;border-top:1px solid var(--line);padding-top:16px}
  .tick-head{
    display:flex;align-items:center;gap:8px;color:var(--dim);
    font:500 11px var(--font-mono);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px;
  }
  .tick-head .live{
    width:6px;height:6px;border-radius:50%;background:var(--allow);
    animation:pulse 2.6s ease-out infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(63,185,80,.45)}
    70%{box-shadow:0 0 0 8px rgba(63,185,80,0)}
    100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}
  }
  .tick-rows{display:flex;flex-direction:column;min-height:140px}
  .tick-row{
    display:flex;align-items:center;gap:14px;font-size:12.5px;padding:9px 2px;
    border-bottom:1px solid var(--line-soft);animation:slidein .4s ease-out;
  }
  .tick-row:last-child{border-bottom:0}
  @keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .tick-row .c{color:var(--dim);font-family:var(--font-mono);flex:0 0 46px}
  .tick-row .a{font-family:var(--font-mono);font-variant-numeric:tabular-nums;flex:0 0 104px;text-align:right}
  .tick-row .w{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tick-row .p{font-family:var(--font-mono);flex:0 0 46px;text-align:right;font-weight:600}
  @media (prefers-reduced-motion: reduce){
    .tick-row{animation:none} .tick-head .live{animation:none}
  }
  @media (max-width:620px){
    /* Значок действия не сжимается: «Задержать и позвонить» держит свою
       ширину, и строка вылезает за экран. Причём только та строка, где такое
       действие выпало, — из-за чего переполнение то появлялось, то исчезало.
       Время и причину на узком экране убираем, действие и сумму оставляем. */
    .tick-row{gap:9px;font-size:12px;padding:8px 0}
    .tick-row .c, .tick-row .w{display:none}
    .tick-row .a{flex:1;text-align:left}
  }

  /* ---------- показатели ----------
     Не карточки: колонки, разделённые волосяной линией. Шесть одинаковых
     плашек с рамками читаются как шесть отдельных объектов, хотя это один
     ряд однородных чисел. */
  .kpis{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(min(168px,100%),1fr));
    gap:0;margin:24px 0 8px;border-top:1px solid var(--line);
  }
  .kpi{padding:16px 20px 16px 0;border-right:1px solid var(--line-soft)}
  .kpi:last-child{border-right:0}
  .kpi .k{color:var(--dim);font-size:11.5px;margin-bottom:8px;line-height:1.35}
  .kpi .v{font-size:27px;font-weight:600;letter-spacing:-.8px;line-height:1}
  .kpi .n{color:var(--dim);font-size:11px;margin-top:7px;font-family:var(--font-mono)}
  .kpi.good .v{color:var(--allow)} .kpi.warn .v{color:var(--stepup)}
  .kpi.hot .v{color:var(--hold)} .kpi.bad .v{color:var(--block)}
  @media (max-width:760px){ .kpi{border-right:0;border-bottom:1px solid var(--line-soft)} }

  /* ---------- значки действий: единственный цвет на экране ---------- */
  .badge{
    display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:5px;
    font:600 11.5px var(--font);white-space:nowrap;
  }
  .badge::before{content:"";width:5px;height:5px;border-radius:1px;background:currentColor}
  .b-allow{background:rgba(63,185,80,.11);color:var(--allow)}
  .b-step_up{background:rgba(210,153,34,.12);color:var(--stepup)}
  .b-hold{background:rgba(219,109,40,.12);color:var(--hold)}
  .b-block{background:rgba(229,72,77,.11);color:var(--block)}

  /* ---------- таблицы ---------- */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{
    text-align:left;color:var(--dim);font:500 11px var(--font-mono);
    letter-spacing:.5px;text-transform:uppercase;padding:0 12px 9px 0;
    border-bottom:1px solid var(--line);white-space:nowrap;
  }
  td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line-soft);vertical-align:top}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:rgba(255,255,255,.018)}
  .num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  th.num{padding-right:0}
  td.num{padding-right:0}

  /* ---------- формы ---------- */
  label{display:block;color:var(--dim);font-size:11.5px;margin-bottom:6px}
  input,select{
    width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:8px 11px;border-radius:7px;font:14px var(--font);
  }
  input:focus,select:focus{outline:none;border-color:var(--accent);background:var(--panel)}
  input[type=range]{padding:0;height:20px;accent-color:var(--text);background:transparent;border:0}
  input[type=checkbox]{width:auto;accent-color:var(--text)}
  .btn{
    background:var(--text);border:0;color:var(--bg);padding:9px 17px;border-radius:7px;
    cursor:pointer;font:600 13.5px var(--font);
  }
  .btn:hover{opacity:.88}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:500}
  .btn.ghost:hover{border-color:var(--accent);opacity:1}
  .btn:disabled{opacity:.45;cursor:default}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    background:var(--panel2);border:1px solid var(--line);color:var(--muted);
    padding:11px 14px;border-radius:9px;cursor:pointer;font:13px var(--font);text-align:left;
    transition:border-color .12s;
  }
  .chip:hover{border-color:var(--accent);color:var(--text)}
  .chip.on{background:var(--panel);border-color:var(--text);color:var(--text)}
  .toggles{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  .toggles label{display:flex;align-items:center;gap:8px;margin:0;color:var(--text);font-size:13px;cursor:pointer}

  /* ---------- прочее ---------- */
  .note{
    background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent);
    border-radius:0 8px 8px 0;padding:13px 16px;font-size:13px;color:var(--muted);line-height:1.65;
  }
  .note.warn{border-left-color:var(--hold)}
  .reason{
    display:flex;gap:11px;align-items:flex-start;padding:9px 0;
    border-bottom:1px solid var(--line-soft);font-size:13px;
  }
  .reason:last-child{border-bottom:0}
  .reason .m{flex:0 0 4px;height:4px;border-radius:1px;margin-top:8px;background:var(--dim)}
  .reason.risk .m{background:var(--block)} .reason.safe .m{background:var(--allow)}
  .reason .c{margin-left:auto;color:var(--dim);font:11.5px var(--font-mono);white-space:nowrap}
  .msgbox{
    background:rgba(219,109,40,.07);border:1px solid rgba(219,109,40,.26);
    border-radius:10px;padding:15px 17px;line-height:1.7;font-size:13.5px;
  }
  .msgbox.block{background:rgba(229,72,77,.07);border-color:rgba(229,72,77,.26)}
  .msgbox.step_up{background:rgba(210,153,34,.07);border-color:rgba(210,153,34,.24)}
  .loading{color:var(--dim);padding:28px;text-align:center;font-size:13px}
  svg{display:block;max-width:100%;overflow:visible}

let LANG = "ru";
const T = k => (I18N[LANG] && I18N[LANG][k]) || I18N.ru[k] || k;

/* ---------------------------------------------------------------- утилиты */
const $  = (s,r=document)=>r.querySelector(s);
const el = (t,a={},...kids)=>{
  const n=document.createElement(t);
  for(const [k,v] of Object.entries(a)){
    if(k==="class") n.className=v;
    else if(k==="html") n.innerHTML=v;
    else if(k.startsWith("on")) n.addEventListener(k.slice(2),v);
    else if(v!==null&&v!==undefined) n.setAttribute(k,v);
  }
  for(const c of kids.flat()) if(c!==null&&c!==undefined)
    n.appendChild(typeof c==="object"?c:document.createTextNode(String(c)));
  return n;
};
const LOC = {ru:"ru-RU", kk:"kk-KZ", en:"en-US"};
const nf  = n => new Intl.NumberFormat(LOC[LANG]).format(Math.round(n||0));
const money = n => nf(n)+" ₸";
const UNITS = {ru:["тыс","млн","млрд"], kk:["мың","млн","млрд"], en:["K","M","B"]};
const short1 = x => (Math.abs(x)>=100 ? Math.round(x) : Math.round(x*10)/10)
  .toLocaleString(LOC[LANG]);
const compact = n => {
  const u=UNITS[LANG]||UNITS.ru, a=Math.abs(n||0);
  if(a>=1e9) return short1(n/1e9)+" "+u[2];
  if(a>=1e6) return short1(n/1e6)+" "+u[1];
  if(a>=1e3) return short1(n/1e3)+" "+u[0];
  return nf(n);
};
const pct = (x,d=1) => ((x||0)*100).toFixed(d)+"%";
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ACT_COLOR = {allow:"var(--allow)",step_up:"var(--stepup)",hold:"var(--hold)",block:"var(--block)"};

/* Витрина без сервера: если в страницу вшит набор ответов, берём их оттуда.
   Так статичная версия и живая используют один и тот же код интерфейса —
   иначе демо начало бы расходиться с продуктом. */
async function api(path, opts){
  if(window.FH_STATIC) return staticApi(path, opts);
  const r = await fetch(path, opts);
  if(!r.ok) throw new Error(path+" → "+r.status);
  return r.json();
}

function staticApi(path, opts){
  const B = window.FH_STATIC;
  if(opts && opts.method === "POST"){
    // Сравниваем разобранные структуры, а не строки: Python пишет число как
    // 240000.0, JavaScript как 240000, и посимвольное сравнение не сойдётся.
    // После JSON.parse обе стороны нормализуются одинаково.
    let want;
    try{ want = JSON.stringify(JSON.parse(opts.body)); }
    catch(_){ return Promise.reject(new Error("STATIC_BAD_BODY")); }
    const base = path.split("?")[0];
    const hit = (B.posts||[]).find(
      s => s.path === base && JSON.stringify(s.body) === want);
    if(hit) return Promise.resolve(hit.result);
    return Promise.reject(new Error("STATIC_NO_MODEL"));
  }
  if(B.get && B.get[path] !== undefined) return Promise.resolve(B.get[path]);
  const base = path.split("?")[0];
  if(B.get && B.get[base] !== undefined) return Promise.resolve(B.get[base]);
  return Promise.reject(new Error("STATIC_MISSING: "+path));
}
const IS_STATIC = () => !!window.FH_STATIC;

/* ---------------------------------------------------------------- SVG */
const SVGNS="http://www.w3.org/2000/svg";
const svgEl=(t,a={})=>{
  const n=document.createElementNS(SVGNS,t);
  for(const [k,v] of Object.entries(a)) if(v!==null&&v!==undefined) n.setAttribute(k,v);
  return n;
};
function svgRoot(w,h){
  // xMinYMid: график прижат влево. Иначе при широком контейнере viewBox
  // центрируется и слева остаётся пустая полоса в треть экрана.
  return svgEl("svg",{viewBox:`0 0 ${w} ${h}`,width:"100%",height:h,role:"img",
    preserveAspectRatio:"xMinYMid meet"});
}
function svgText(x,y,txt,a={}){
  const t=svgEl("text",Object.assign({x,y,fill:"var(--muted)","font-size":11,
    "font-family":"inherit"},a));
  t.textContent=txt; return t;
}

/* Горизонтальная линейчатая диаграмма — самая честная форма для сравнений */
function barsH(rows,{w=560,barH=30,gap=9,fmt=nf,pad=170}={}){
  const h=rows.length*(barH+gap)+8;
  const s=svgRoot(w,h);
  const max=Math.max(...rows.map(r=>r.value),1);
  rows.forEach((r,i)=>{
    const y=i*(barH+gap);
    const bw=Math.max(2,(w-pad-96)*(r.value/max));
    s.appendChild(svgText(0,y+barH/2+4,r.label,{fill:"var(--text)","font-size":12.5}));
    s.appendChild(svgEl("rect",{x:pad,y,width:w-pad-96,height:barH,rx:7,fill:"rgba(255,255,255,.035)"}));
    s.appendChild(svgEl("rect",{x:pad,y,width:bw,height:barH,rx:7,fill:r.color||"var(--data)"}));
    s.appendChild(svgText(pad+bw+10,y+barH/2+4,fmt(r.value),
      {fill:"var(--text)","font-size":12.5,"font-variant-numeric":"tabular-nums"}));
  });
  return s;
}

const CACHE = {};

  if(!CACHE[key]) CACHE[key] = api(path);
  return CACHE[key];
}

function kpi(cls,label,value,note){

/* ---- столбцы по дням с линией фрода поверх ---- */
function dailyChart(daily){
  const w=980,h=240,padL=52,padR=16,padT=16,padB=30;
  const s=svgRoot(w,h);
  const maxTx=Math.max(...daily.map(d=>d.transactions),1);
  const maxFr=Math.max(...daily.map(d=>d.fraud),1);
  const iw=w-padL-padR, ih=h-padT-padB;
  const bw=Math.max(3,iw/daily.length*0.66);

  for(let i=0;i<=4;i++){
    const y=padT+ih*i/4;
    s.appendChild(svgEl("line",{x1:padL,x2:w-padR,y1:y,y2:y,stroke:"var(--line)","stroke-width":1}));
    s.appendChild(svgText(padL-8,y+4,compact(maxTx*(1-i/4)),{"text-anchor":"end"}));
  }
  daily.forEach((d,i)=>{
    const x=padL+iw*(i+0.5)/daily.length;
    const bh=ih*(d.transactions/maxTx);
    s.appendChild(svgEl("rect",{x:x-bw/2,y:padT+ih-bh,width:bw,height:bh,rx:3,
      fill:"var(--data-fill)"}));
  });
  const pts=daily.map((d,i)=>{
    const x=padL+iw*(i+0.5)/daily.length;
    const y=padT+ih-ih*(d.fraud/maxFr)*0.92;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  s.appendChild(svgEl("polyline",{points:pts,fill:"none",stroke:"var(--block)","stroke-width":2,
    "stroke-linejoin":"round"}));
  daily.forEach((d,i)=>{
    const x=padL+iw*(i+0.5)/daily.length;
    const y=padT+ih-ih*(d.fraud/maxFr)*0.92;
    const c=svgEl("circle",{cx:x,cy:y,r:2.6,fill:"var(--block)"});
    c.appendChild(svgEl("title")).textContent=`${d.day}: ${d.transactions} ${T("tx")}, ${d.fraud} ${T("fraud_yes")}`;
    s.appendChild(c);
  });
  daily.forEach((d,i)=>{
    if(i%4) return;
    const x=padL+iw*(i+0.5)/daily.length;
    s.appendChild(svgText(x,h-9,String(d.day).slice(5),{"text-anchor":"middle","font-size":10}));
  });
  return s;
}

/* ---- кривая надёжности: предсказано против фактического ---- */
function reliabilityChart(bins){
  const w=420,h=300,pad=44;
  const s=svgRoot(w,h);
  const iw=w-pad-14, ih=h-pad-28;
  const X=v=>pad+iw*Math.min(v,1), Y=v=>h-pad+14-ih*Math.min(v,1);
  for(let i=0;i<=4;i++){
    const g=i/4;
    s.appendChild(svgEl("line",{x1:pad,x2:w-14,y1:Y(g),y2:Y(g),stroke:"var(--line)"}));
    s.appendChild(svgText(pad-8,Y(g)+4,g.toFixed(2),{"text-anchor":"end","font-size":10}));
    s.appendChild(svgText(X(g),h-12,g.toFixed(2),{"text-anchor":"middle","font-size":10}));
  }
  s.appendChild(svgEl("line",{x1:X(0),y1:Y(0),x2:X(1),y2:Y(1),
    stroke:"var(--dim)","stroke-dasharray":"4 4","stroke-width":1.4}));
  const pts=bins.map(b=>`${X(b.predicted).toFixed(1)},${Y(b.actual).toFixed(1)}`).join(" ");
  if(bins.length>1)
    s.appendChild(svgEl("polyline",{points:pts,fill:"none",stroke:"var(--data-strong)","stroke-width":2}));
  bins.forEach(b=>{
    const c=svgEl("circle",{cx:X(b.predicted),cy:Y(b.actual),
      r:Math.max(3.5,Math.min(11,Math.sqrt(b.count)/5.5)),
      fill:"var(--data)","fill-opacity":.5,stroke:"var(--data-strong)"});
    c.appendChild(svgEl("title")).textContent=
      `n=${b.count} · ${T("res_p")} ${b.predicted.toFixed(3)} · ${T("fraud_yes")} ${b.actual.toFixed(3)}`;
    s.appendChild(c);
  });
  s.appendChild(svgText(pad,20,T("res_p"),{"font-size":10.5}));
  return s;
}

/* Живая лента в обложке: проигрываем настоящие размеченные операции из
   тестового периода. Это не декорация и не выдумка — те же записи лежат во
   вкладке «Лента», просто здесь они идут потоком. */
let TICKER = null;
function startTicker(box, items){
  if(TICKER){ clearInterval(TICKER); TICKER=null; }
  if(!items.length) return;
  // Показываем не подряд, а вперемешку интересное и обычное: сплошные
  // «пропустить» усыпляют, сплошные блокировки врут про долю фрода.
  const hot = items.filter(i => i.action !== "allow");
  const calm = items.filter(i => i.action === "allow");
  const order = [];
  for(let i=0;i<40;i++){
    const pool = (i % 3 === 0 && hot.length) ? hot : (calm.length ? calm : hot);
    order.push(pool[i % pool.length]);
  }
  let k = 0;
  const push = () => {
    const it = order[k++ % order.length];
    if(!it) return;
    const reason = (it.reasons.find(r => r.direction === "risk") || {}).text;
    const row = el("div",{class:"tick-row"+(it.action!=="allow"?" hot":"")},
      el("span",{class:"c"}, String(it.timestamp).slice(11,16)),
      el("span",{class:"a"}, nf(it.amount)+" ₸"),
      el("span",{class:"badge b-"+it.action}, T(it.action)),
      el("span",{class:"w"}, reason ? (reason[LANG]||reason.ru) : (it.city||"")),
      el("span",{class:"p",style:"color:"+(it.p_fraud>0.5?"var(--block)":it.p_fraud>0.1?"var(--stepup)":"var(--dim)")},
        (it.p_fraud*100).toFixed(0)+"%"));
    box.insertBefore(row, box.firstChild);
    while(box.children.length > 4) box.removeChild(box.lastChild);
  };
  for(let i=0;i<4;i++) push();          // страница не должна открываться пустой
  TICKER = setInterval(push, 1700);
}

function hero(st, mt, report){
  const box = el("div",{class:"hero"});
  box.appendChild(el("div",{class:"eyebrow"},T("eyebrow")));
  box.appendChild(el("h1",{html:T("hero_title")}));
  box.appendChild(el("p",{class:"lead"},T("hero_lead")));

  const pills = el("div",{class:"pills"});
  const arch = (report && report.architecture) || {};
  const add = (label, value) => pills.appendChild(
    el("span",{class:"pill"}, el("b",{},value), el("span",{},label)));
  add(T("pill_features"), String(arch.n_features || 51));
  add(T("pill_channels"), "2");
  add(T("pill_actions"), "4");
  add(T("pill_tx"), compact(st.transactions));
  add(T("pill_prauc"), st.pr_auc.toFixed(3));
  box.appendChild(pills);

  const tick = el("div",{class:"tick"});
  tick.appendChild(el("div",{class:"tick-head"},
    el("span",{class:"live"}), T("hero_live")));
  const rows = el("div",{class:"tick-rows"});
  tick.appendChild(rows);
  box.appendChild(tick);

  api("/api/feed?limit=60&action=all&only_fraud=false")
    .then(d => startTicker(rows, d.items))
    .catch(() => {});
  return box;
}

async function viewDashboard(root){
  root.appendChild(el("div",{class:"loading"},"…"));
  let st, mt;
  try{
    [st,mt] = await Promise.all([cached("stats","/api/stats"), cached("metrics","/api/metrics")]);
  }catch(e){ root.innerHTML=""; root.appendChild(el("div",{class:"note"},T("err")+": "+e.message)); return; }
  root.innerHTML="";

  let rep = {};
  try{ rep = await cached("report","/api/report"); }catch(_){}
  root.appendChild(hero(st, mt, rep));

  root.appendChild(el("h2",{},T("dash_h")));
  root.appendChild(el("p",{class:"sub"},T("dash_sub")));

  root.appendChild(el("div",{class:"kpis"},
    kpi("", T("kpi_tx"), nf(st.transactions), compact(st.turnover)+" ₸"),
    kpi("good", T("kpi_caught"), pct(st.detection_rate),
        nf(st.caught_count)+" "+T("of")+" "+nf(st.fraud_count)),
    kpi("warn", T("kpi_friction"), pct(st.friction_rate,2),
        nf(st.friction_count)+" "+T("tx")),
    kpi("good", T("kpi_saved"), compact(st.saving_vs_threshold)+" ₸",
        T("no_system")+": "+compact(st.saving_vs_nothing)+" ₸"),
    kpi("bad", T("kpi_missed"), nf(st.missed_count), compact(st.missed_amount)+" ₸"),
    kpi("", T("kpi_prauc"), st.pr_auc.toFixed(3), "ROC-AUC "+st.roc_auc.toFixed(3)),
  ));

  /* поток по дням */
  const p1=el("div",{class:"panel"},
    el("h3",{},T("daily_h")),
    el("p",{class:"sub"},T("daily_sub")));
  p1.appendChild(dailyChart(st.daily));
  p1.appendChild(el("div",{class:"lgd"},
    el("span",{html:'<i style="background:var(--data-fill)"></i>'+esc(T("tx"))}),
    el("span",{html:'<i style="background:var(--block)"></i>'+esc(T("fraud_yes"))})));
  root.appendChild(p1);

  /* решения и типы */
  const two=el("div",{class:"grid",style:"grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));margin-top:14px"});
  const pA=el("div",{class:"panel"},el("h3",{},T("actions_h")),el("p",{class:"sub"},T("actions_sub")));
  pA.appendChild(barsH(
    ["allow","step_up","hold","block"].map(a=>({label:T(a),value:st.actions[a]||0,color:ACT_COLOR[a]})),
    {w:520,pad:150,fmt:v=>nf(v)+"  ("+pct(v/st.transactions,2)+")"}));
  two.appendChild(pA);

  const pB=el("div",{class:"panel"},el("h3",{},T("types_h")),el("p",{class:"sub"},T("types_sub")));
  const typeRows=Object.entries(st.per_type||{}).map(([k,v])=>({
    label:T(k)+" ("+v.count+")", value:v.detected_share,
    color:k==="social_eng"?"var(--data-strong)":"var(--data)"}));
  pB.appendChild(barsH(typeRows,{w:520,pad:170,fmt:v=>pct(v)}));
  /* Распределение действий по схемам: одна строка на схему, действия всегда
     в одном порядке. Плавающий порядок заставлял бы сравнивать строки
     пословно вместо того, чтобы читать их по столбцам. */
  const dist=el("div",{style:"margin-top:18px;border-top:1px solid var(--line);padding-top:14px"});
  for(const [k,v] of Object.entries(st.per_type||{})){
    const row=el("div",{style:"display:flex;gap:8px;align-items:baseline;margin-bottom:9px;flex-wrap:wrap"});
    row.appendChild(el("span",{class:"dim",style:"font-size:11.5px;flex:0 0 118px"},T(k)));
    for(const a of ["allow","step_up","hold","block"]){
      const n=(v.actions||{})[a]||0;
      row.appendChild(el("span",{
        class: n ? "badge b-"+a : "",
        style: n ? "" : "font-size:11.5px;color:var(--dim);padding:3px 9px"
      }, n ? T(a)+" "+n : "—"));
    }
    dist.appendChild(row);
  }
  pB.appendChild(dist);
  two.appendChild(pB);
  root.appendChild(two);

  /* деньги */
  const pM=el("div",{class:"panel",style:"margin-top:14px"},
    el("h3",{},T("money_h")), el("p",{class:"sub"},T("money_sub")));
  /* Здесь сравниваются затраты, а не решения, поэтому цвета действий не
     используются: красный столбец «без системы» перетягивал бы внимание с
     живых решений, ничего при этом не означая. Базовые линии — нейтральные
     чернила данных, выделен только наш результат, и выделен яркостью. */
  const cb=st.cost_baselines||{};
  const moneyRows=[];
  moneyRows.push({label:T("no_system"),value:cb.no_system||0,color:"var(--data-dim)"});
  for(const [k,v] of Object.entries(cb)){
    if(k==="no_system") continue;
    moneyRows.push({label:k.replace("threshold_best_","порог ").replace("threshold_","порог "),
      value:v,color:"var(--data)"});
  }
  moneyRows.push({label:"Fraud Hunter",value:st.cost_ours,color:"var(--text)"});
  pM.appendChild(barsH(moneyRows,{w:760,pad:190,fmt:v=>compact(v)+" ₸",barH:34}));
  root.appendChild(pM);

  /* калибровка и важность */
  const two2=el("div",{class:"grid",style:"grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));margin-top:14px"});
  const pR=el("div",{class:"panel"},el("h3",{},T("rel_h")),el("p",{class:"sub"},T("rel_sub")));
  pR.appendChild(reliabilityChart(mt.reliability||[]));
  two2.appendChild(pR);

  const pI=el("div",{class:"panel"},el("h3",{},T("imp_h")));
  const imp=(mt.feature_importance||[]).slice(0,10);
  const maxG=Math.max(...imp.map(i=>i.gain),1);
  pI.appendChild(barsH(imp.map(i=>({label:i.feature,value:i.gain/maxG,color:"var(--data)"})),
    {w:520,pad:190,barH:22,gap:6,fmt:v=>(v*100).toFixed(0)}));
  two2.appendChild(pI);
  root.appendChild(two2);
}
</script>

<script>
"use strict";
/* ======================================================================
   Симулятор: сценарий → решение → объяснение → сообщение клиенту
   ====================================================================== */

let SIM = { presets:null, manual:null, econ:null, last:null };

/* Ожидаемые потери по четырём действиям. Выбранное подсвечено. */
function costChart(costs, chosen){
  const rows=["allow","step_up","hold","block"].map(a=>({
    label:T(a), value:Math.max(costs[a]||0,0),
    color: a===chosen ? ACT_COLOR[a] : "rgba(255,255,255,.26)"
  }));
  return barsH(rows,{w:620,pad:170,barH:30,fmt:v=>money(v)});
}

/* Шкала вероятности */
function gauge(p){
  const w=300,h=92,s=svgRoot(w,h);
  const x0=10,x1=w-10,y=54;
  s.appendChild(svgEl("rect",{x:x0,y:y-9,width:x1-x0,height:18,rx:9,fill:"rgba(255,255,255,.06)"}));
  const grad=svgEl("linearGradient",{id:"gg",x1:"0",x2:"1"});
  [["0%","var(--allow)"],["45%","var(--stepup)"],["72%","var(--hold)"],["100%","var(--block)"]]
    .forEach(([o,c])=>grad.appendChild(svgEl("stop",{offset:o,"stop-color":c})));
  const defs=svgEl("defs"); defs.appendChild(grad); s.appendChild(defs);
  s.appendChild(svgEl("rect",{x:x0,y:y-9,width:Math.max(4,(x1-x0)*p),height:18,rx:9,fill:"url(#gg)"}));
  const cx=x0+(x1-x0)*p;
  s.appendChild(svgEl("circle",{cx,cy:y,r:11,fill:"var(--panel)",stroke:"#fff","stroke-width":2.5}));
  const t=svgText(cx,30,(p*100).toFixed(1)+"%",
    {"text-anchor":"middle",fill:"var(--text)","font-size":19,"font-weight":700});
  s.appendChild(t);
  s.appendChild(svgText(x0,y+30,"0%",{"font-size":10}));
  s.appendChild(svgText(x1,y+30,"100%",{"text-anchor":"end","font-size":10}));
  return s;
}

/* Карта решений: самый прямой ответ на вопрос «а где у вас порог».
   По горизонтали вероятность, по вертикали сумма в логарифме. Граница между
   действиями — не линия, а кривая, которая ползёт влево с ростом суммы. */
function decisionMap(data, current){
  const rows=data.amounts.length, cols=data.probabilities.length;
  void rows;
  const padL=68, padB=44, padT=12, padR=14;
  // Ячейку считаем от числа столбцов, а не берём фиксированной: при жёстком
  // размере карта занимала две трети панели и треть ширины уходила в пустоту.
  const cw=Math.max(14, Math.min(26, Math.round(980/cols)));
  const ch=Math.round(cw*0.78);
  const W=padL+cols*cw+padR, H=padT+rows*ch+padB;
  const s=svgRoot(W,H);

  const yOf=i=>padT+(rows-1-i)*ch;     // крупные суммы сверху
  const xOf=j=>padL+j*cw;

  for(let i=0;i<rows;i++)
    for(let j=0;j<cols;j++){
      const a=data.grid[i][j];
      const r=svgEl("rect",{x:xOf(j),y:yOf(i),width:cw+0.5,height:ch+0.5,
        fill:ACT_COLOR[a],"fill-opacity":.72});
      r.appendChild(svgEl("title")).textContent=
        `${compact(data.amounts[i])} ₸ · ${T("res_p")} ${(data.probabilities[j]*100).toFixed(0)}% → ${T(a)}`;
      s.appendChild(r);
    }

  /* подписи оси сумм — через одну, иначе сливаются */
  for(let i=0;i<rows;i+=3)
    s.appendChild(svgText(padL-9,yOf(i)+ch-2,compact(data.amounts[i]),
      {"text-anchor":"end","font-size":10}));
  for(let j=0;j<cols;j+=5)
    s.appendChild(svgText(xOf(j)+cw/2,H-padB+18,(data.probabilities[j]*100).toFixed(0)+"%",
      {"text-anchor":"middle","font-size":10}));
  s.appendChild(svgText(padL,H-padB+34,T("res_p"),{"font-size":10.5}));
  s.appendChild(svgText(padL-9,padT-1,T("f_amount"),{"text-anchor":"end","font-size":10.5}));

  /* где сейчас находится разбираемая операция */
  if(current){
    let bi=0, best=Infinity;
    data.amounts.forEach((a,i)=>{
      const d=Math.abs(Math.log(a)-Math.log(Math.max(current.amount,1)));
      if(d<best){best=d;bi=i;}
    });
    const bj=Math.round(current.p*(cols-1));
    s.appendChild(svgEl("rect",{x:padL-2,y:yOf(bi)-2,width:cols*cw+4,height:ch+4,
      fill:"none",stroke:"rgba(255,255,255,.5)","stroke-width":1.2,rx:3}));
    s.appendChild(svgEl("circle",{cx:xOf(bj)+cw/2,cy:yOf(bi)+ch/2,r:7,
      fill:"none",stroke:"#fff","stroke-width":2.5}));
  }

  const lg=el("div",{class:"lgd"});
  ["allow","step_up","hold","block"].forEach(a=>
    lg.appendChild(el("span",{html:`<i style="background:${ACT_COLOR[a]}"></i>`+esc(T(a))})));
  const box=el("div",{});
  const sc=el("div",{class:"scroll"}); sc.appendChild(s);
  box.appendChild(sc); box.appendChild(lg);
  return box;
}

function renderReasons(reasons){
  const box=el("div",{});
  for(const r of reasons){
    box.appendChild(el("div",{class:"reason "+r.direction},
      el("span",{class:"m"}),
      el("span",{},r.text[LANG]||r.text.ru),
      el("span",{class:"c"},(r.contribution>0?"+":"")+r.contribution.toFixed(2))));
  }
  if(!reasons.length) box.appendChild(el("div",{class:"dim"},"—"));
  return box;
}

/* Разбор одного шага сценария */
function renderStep(step, idx, total, transactions){
  const d=step.decision;
  const wrap=el("div",{class:"panel",style:"margin-top:14px"});

  const head=el("div",{style:"display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:6px"});
  if(total>1) head.appendChild(el("span",{class:"dim",style:"font-size:12px"},
    T("res_step")+" "+(idx+1)+"/"+total));
  head.appendChild(el("span",{class:"badge b-"+d.action,style:"font-size:13px;padding:6px 14px"},d.action_label));
  head.appendChild(el("span",{class:"muted",style:"font-size:13px"},
    money(step.transaction.amount)+" · "+step.transaction.merchant_category+" · "+(step.transaction.city||"")));
  head.appendChild(el("span",{class:"dim",style:"font-size:12px;margin-left:auto"},
    T("res_kind")+": "+T(step.dominant_kind)));
  wrap.appendChild(head);

  const cols=el("div",{class:"grid",style:"grid-template-columns:repeat(auto-fit,minmax(min(310px,100%),1fr));gap:18px;margin-top:10px"});

  const c1=el("div",{});
  c1.appendChild(el("h3",{},T("res_p")));
  c1.appendChild(gauge(step.p_fraud));
  c1.appendChild(el("div",{class:"dim",style:"font-size:12px;margin-top:2px"},
    T("margin")+": "+money(d.margin_to_next)+" ("+T(d.runner_up)+")"));
  /* Два независимых канала. Второй существует ради схем, которых не было в
     обучении: он не знает разметки и потому на них не слепнет. */
  if(step.p_anomaly !== null && step.p_anomaly !== undefined){
    const ch=el("div",{style:"margin-top:12px;font-size:12.5px"});
    ch.appendChild(el("div",{class:"muted",style:"margin-bottom:6px"},T("channels")));
    const bar=(label,v,color)=>{
      const row=el("div",{style:"display:flex;align-items:center;gap:8px;margin-bottom:5px"});
      row.appendChild(el("span",{class:"dim",style:"flex:0 0 132px;font-size:11.5px"},label));
      const track=el("div",{style:"flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.07)"});
      track.appendChild(el("div",{style:`width:${Math.max(2,v*100)}%;height:100%;border-radius:4px;background:${color}`}));
      row.appendChild(track);
      row.appendChild(el("span",{class:"mono",style:"flex:0 0 46px;text-align:right;font-size:11.5px"},v.toFixed(3)));
      return row;
    };
    ch.appendChild(bar(T("ch_supervised"), step.p_supervised, "var(--data)"));
    ch.appendChild(bar(T("ch_anomaly"), step.p_anomaly, "var(--data-dim)"));
    c1.appendChild(ch);
  }
  cols.appendChild(c1);

  const c2=el("div",{});
  c2.appendChild(el("h3",{},T("res_costs")));
  c2.appendChild(el("p",{class:"sub",style:"margin-bottom:10px"},T("res_costs_sub")));
  c2.appendChild(costChart(d.expected_costs, d.action));
  cols.appendChild(c2);
  wrap.appendChild(cols);

  const cols2=el("div",{class:"grid",style:"grid-template-columns:repeat(auto-fit,minmax(min(310px,100%),1fr));gap:18px;margin-top:16px"});
  const c3=el("div",{});
  c3.appendChild(el("h3",{},T("res_why")));
  c3.appendChild(renderReasons(step.reasons));
  cols2.appendChild(c3);

  const c4=el("div",{});
  const msg=(step.client_message||{})[LANG];
  if(msg){
    c4.appendChild(el("h3",{},T("res_client")));
    c4.appendChild(el("div",{class:"msgbox "+d.action},msg));
  }
  const op=(step.operator_script||{})[LANG];
  if(op){
    c4.appendChild(el("h3",{style:"margin-top:16px"},T("res_operator")));
    c4.appendChild(el("div",{class:"note warn"},op));
  }
  if(!msg && !op) c4.appendChild(el("div",{class:"note"},"—"));
  cols2.appendChild(c4);
  wrap.appendChild(cols2);

  /* Контрфакты: SHAP отвечает «почему так решили», а это — «что надо было
     иначе». Оператору и клиенту второй вопрос нужен чаще. */
  if(idx === total - 1){
    const cf = el("div",{style:"margin-top:16px"});
    cf.appendChild(el("h3",{},T("cf_h")));
    cf.appendChild(el("p",{class:"sub",style:"margin-bottom:10px"},T("cf_sub")));
    const slot = el("div",{class:"dim",style:"font-size:13px"},"…");
    cf.appendChild(slot);
    wrap.appendChild(cf);

    // Шлём всю серию и ту же экономику, под которой принято решение: иначе
    // контрфакт объясняет не то решение, что показано выше.
    const cfBody = {transactions: transactions};
    if(SIM.econ) cfBody.economics = SIM.econ;
    api("/api/counterfactual",{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(cfBody)})
      .then(res=>{
        slot.innerHTML=""; slot.className="";
        (res.items||[]).forEach(c=>{
          const row=el("div",{class:"reason",style:"align-items:center"},
            el("span",{class:"m",style:"background:var(--data-strong)"}),
            el("span",{},c.text[LANG]||c.text.ru),
            el("span",{class:"c"},
              el("span",{class:"badge b-"+c.action_to,style:"font-size:11px"},T(c.action_to))));
          slot.appendChild(row);
        });
        if(res.note) slot.appendChild(el("div",{class:"note"},res.note[LANG]||res.note.ru));
      })
      .catch(()=>{ slot.textContent = T("cf_unavailable"); });
  }
  return wrap;
}

async function runSequence(transactions, out){
  out.innerHTML="";
  out.appendChild(el("div",{class:"loading"},T("sim_running")));
  try{
    const body={transactions};
    if(SIM.econ) body.economics=SIM.econ;
    const res=await api("/api/score-sequence",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    SIM.last={transactions,res};
    out.innerHTML="";
    if(SIM.econ) out.appendChild(el("div",{class:"note",style:"margin-bottom:12px"},T("econ_applied")));
    res.steps.forEach((s,i)=>out.appendChild(renderStep(s,i,res.steps.length,transactions)));

    /* карта решений для схемы из последнего шага */
    const last=res.steps[res.steps.length-1];
    const dm=await api(`/api/decision-map?kind=${last.dominant_kind}`+
      `&tx_type=${encodeURIComponent(last.transaction.tx_type)}`);
    const cp=el("div",{class:"panel",style:"margin-top:14px"},
      el("h3",{},T("curve_h")), el("p",{class:"sub"},T("curve_sub")));
    cp.appendChild(decisionMap(dm,{p:last.p_fraud,amount:last.transaction.amount}));
    out.appendChild(cp);
  }catch(e){
    out.innerHTML="";
    out.appendChild(el("div",{class:"note"},T("err")+": "+e.message));
  }
}

function manualForm(ref, presets){
  const box=el("div",{class:"grid",style:"grid-template-columns:repeat(auto-fit,minmax(min(168px,100%),1fr));gap:12px"});
  const base=presets[0].sequence[0];
  const mk=(key,label,node)=>{ const d=el("div",{}); d.appendChild(el("label",{},label)); d.appendChild(node);
    node.dataset.k=key; return d; };
  const sel=(key,label,opts,val)=>mk(key,label,
    el("select",{}, ...opts.map(o=>el("option",{value:o,...(o===val?{selected:"selected"}:{})},o))));
  const num=(key,label,val,step)=>mk(key,label,el("input",{type:"number",value:val,step:step||"1",min:"0"}));

  box.appendChild(mk("client_id",T("f_client"),el("input",{type:"text",value:base.client_id})));
  box.appendChild(num("amount",T("f_amount"),200000,"1000"));
  box.appendChild(sel("merchant_category",T("f_cat"),ref.categories,"transfer_p2p"));
  box.appendChild(sel("channel",T("f_channel"),ref.channels,"mobile_app"));
  box.appendChild(sel("tx_type",T("f_type"),ref.tx_types,"transfer"));
  box.appendChild(sel("city",T("f_city"),ref.cities,ref.cities[0]));
  box.appendChild(sel("__device",T("f_device"),[T("f_dev_known"),T("f_dev_new")],T("f_dev_known")));
  box.appendChild(num("call_minutes_before",T("f_call"),0,"1"));
  box.appendChild(num("session_duration_s",T("f_session"),90,"5"));
  return box;
}

async function viewSimulator(root){
  root.appendChild(el("div",{class:"loading"},"…"));
  let data;
  try{ data = await cached("presets","/api/presets"); }
  catch(e){ root.innerHTML=""; root.appendChild(el("div",{class:"note"},T("err"))); return; }
  root.innerHTML="";

  root.appendChild(el("h2",{},T("sim_h")));
  root.appendChild(el("p",{class:"sub"},T("sim_sub")));

  const out=el("div",{});
  const panel=el("div",{class:"panel"});

  /* сценарии */
  const chips=el("div",{class:"chips"});
  let activeKey=null;
  data.presets.forEach(p=>{
    const c=el("button",{class:"chip",style:"max-width:250px"},
      el("div",{style:"font-weight:600;color:var(--text);margin-bottom:3px"},p.title),
      el("div",{style:"font-size:11.5px;line-height:1.45"},p.hint));
    c.addEventListener("click",()=>{
      activeKey=p.key;
      [...chips.children].forEach(n=>n.classList.remove("on"));
      c.classList.add("on");
      manualBox.classList.add("hide");
      runSequence(p.sequence,out);
    });
    chips.appendChild(c);
  });
  if(!IS_STATIC()){
    const manualChip=el("button",{class:"chip",style:"max-width:250px"},
      el("div",{style:"font-weight:600;color:var(--text)"},T("sim_manual")));
    manualChip.addEventListener("click",()=>{
      activeKey=null;
      [...chips.children].forEach(n=>n.classList.remove("on"));
      manualChip.classList.add("on");
      manualBox.classList.remove("hide");
    });
    chips.appendChild(manualChip);
  }
  panel.appendChild(chips);

  /* ручной режим */
  const manualBox=el("div",{class:"hide",style:"margin-top:18px"});
  const form=manualForm(data.reference,data.presets);
  manualBox.appendChild(form);
  const tog=el("div",{class:"toggles",style:"margin-top:14px"});
  const cbVpn=el("input",{type:"checkbox"});
  const cbRem=el("input",{type:"checkbox"});
  tog.appendChild(el("label",{},cbVpn,T("f_vpn")));
  tog.appendChild(el("label",{},cbRem,T("f_remote")));
  manualBox.appendChild(tog);
  const runBtn=el("button",{class:"btn",style:"margin-top:14px"},T("sim_run"));
  runBtn.addEventListener("click",()=>{
    const tx={country:"KZ"};
    form.querySelectorAll("[data-k]").forEach(n=>{
      const k=n.dataset.k;
      if(k==="__device") return;
      tx[k] = (n.type==="number") ? Number(n.value) : n.value;
    });
    const devSel=form.querySelector('[data-k="__device"]');
    if(devSel && devSel.value===T("f_dev_new")) tx.device_id="DXMANUAL1";
    const foreign={"Стамбул":"TR","Дубай":"AE","Москва":"RU","Бангкок":"TH","Лондон":"GB"};
    if(foreign[tx.city]) tx.country=foreign[tx.city];
    tx.is_vpn=cbVpn.checked?1:0;
    tx.remote_access=cbRem.checked?1:0;
    if(tx.tx_type==="transfer") tx.recipient_id="R90001";
    runSequence([tx],out);
  });
  manualBox.appendChild(runBtn);
  panel.appendChild(manualBox);
  if(IS_STATIC())
    panel.appendChild(el("div",{class:"note",style:"margin-top:16px"},T("static_note_sim")));
  root.appendChild(panel);
  root.appendChild(out);

  /* сразу показываем самый показательный сценарий */
  chips.children[0].click();
}
</script>

<script>
"use strict";
/* ======================================================================
   Лента, граф связей, география, экономика
   ====================================================================== */

async function viewFeed(root){
  root.appendChild(el("h2",{},T("feed_h")));
  root.appendChild(el("p",{class:"sub"},T("feed_sub")));

  const controls=el("div",{class:"toggles",style:"margin-bottom:14px"});
  const filters=["all","block","hold","step_up","allow"];
  let current="all", onlyFraud=false;
  const btns=el("div",{class:"chips"});
  filters.forEach(f=>{
    const b=el("button",{class:"chip"+(f==="all"?" on":"")},f==="all"?T("f_all"):T(f));
    b.addEventListener("click",()=>{ current=f;
      [...btns.children].forEach(n=>n.classList.remove("on")); b.classList.add("on"); load(); });
    btns.appendChild(b);
  });
  controls.appendChild(btns);
  const cb=el("input",{type:"checkbox"});
  cb.addEventListener("change",()=>{ onlyFraud=cb.checked; load(); });
  controls.appendChild(el("label",{},cb,T("f_only_fraud")));
  root.appendChild(controls);

  const holder=el("div",{class:"panel"});
  root.appendChild(holder);

  async function load(){
    holder.innerHTML="";
    holder.appendChild(el("div",{class:"loading"},"…"));
    try{
      const d=await api(`/api/feed?limit=60&action=${current}&only_fraud=${onlyFraud}`);
      holder.innerHTML="";
      const tbl=el("table",{});
      tbl.appendChild(el("thead",{},el("tr",{},
        ...[T("th_time"),T("th_client"),T("th_amount"),T("th_place"),
            T("th_p"),T("th_action"),T("th_why"),T("th_truth")]
          .map((h,i)=>el("th",{class:i===2||i===4?"num":""},h)))));
      const tb=el("tbody",{});
      d.items.forEach(it=>{
        const why=el("div",{});
        it.reasons.filter(r=>r.direction==="risk").slice(0,2).forEach(r=>
          why.appendChild(el("div",{style:"font-size:12.5px;color:var(--muted);line-height:1.45"},
            r.text[LANG]||r.text.ru)));
        tb.appendChild(el("tr",{},
          el("td",{class:"mono dim",style:"font-size:12px;white-space:nowrap"},
            String(it.timestamp).slice(5,16)),
          el("td",{class:"mono",style:"font-size:12.5px"},it.client_id),
          el("td",{class:"num mono"},nf(it.amount)),
          el("td",{style:"font-size:12.5px"},
            el("div",{},it.city),
            el("div",{class:"dim",style:"font-size:11.5px"},it.merchant_category)),
          el("td",{class:"num mono",style:"font-weight:600;color:"+
            (it.p_fraud>0.5?"var(--block)":it.p_fraud>0.1?"var(--stepup)":"var(--muted)")},
            (it.p_fraud*100).toFixed(1)+"%"),
          el("td",{},el("span",{class:"badge b-"+it.action},it.action_label)),
          el("td",{},why),
          el("td",{},it.is_fraud
            ? el("span",{class:"badge b-block"},T(it.fraud_type||"fraud_yes"))
            : el("span",{class:"dim",style:"font-size:12px"},T("fraud_no")))
        ));
      });
      tbl.appendChild(tb);
      const sc=el("div",{class:"scroll"}); sc.appendChild(tbl);
      holder.appendChild(sc);
      if(!d.items.length) holder.appendChild(el("div",{class:"loading"},"—"));
    }catch(e){
      holder.innerHTML=""; holder.appendChild(el("div",{class:"note"},T("err")+": "+e.message));
    }
  }
  load();
}

/* ---------------------------------------------------------------- граф */
async function viewGraph(root){
  root.appendChild(el("h2",{},T("graph_h")));
  root.appendChild(el("p",{class:"sub"},T("graph_sub")));
  const holder=el("div",{class:"panel"});
  holder.appendChild(el("div",{class:"loading"},"…"));
  root.appendChild(holder);

  let g;
  try{ g = await cached("graph","/api/graph?min_clients=3&limit=6"); }
  catch(e){ holder.innerHTML=""; holder.appendChild(el("div",{class:"note"},T("err"))); return; }
  holder.innerHTML="";

  const hubs=g.nodes.filter(n=>n.type!=="client");
  if(!hubs.length){ holder.appendChild(el("div",{class:"loading"},T("graph_none"))); return; }

  /* Радиальная раскладка: каждый хаб в центре своего кольца.
     Физика тут не нужна — структура и так читается с одного взгляда. */
  const perRow=Math.min(3,hubs.length);
  const cellW=340, cellH=310;
  const rows=Math.ceil(hubs.length/perRow);
  const W=perRow*cellW, H=rows*cellH;
  const s=svgRoot(W,H);

  hubs.forEach((hub,i)=>{
    const cx=(i%perRow)*cellW+cellW/2, cy=Math.floor(i/perRow)*cellH+cellH/2;
    const kids=g.edges.filter(e=>e.source===hub.id);
    const R=Math.min(112, 46+kids.length*5);
    const danger=hub.fraud_share>0.5;

    kids.forEach((e,j)=>{
      const a=(j/kids.length)*Math.PI*2 - Math.PI/2;
      const x=cx+R*Math.cos(a), y=cy+R*Math.sin(a);
      s.appendChild(svgEl("line",{x1:cx,y1:cy,x2:x,y2:y,
        stroke:danger?"rgba(239,68,68,.45)":"rgba(132,151,179,.3)",
        "stroke-width":Math.min(3,1+e.weight*0.35)}));
      const node=g.nodes.find(n=>n.id===e.target)||{};
      const c=svgEl("circle",{cx:x,cy:y,r:8,
        fill:node.fraud_share>0.5?"var(--block)":"var(--data)","fill-opacity":.85});
      c.appendChild(svgEl("title")).textContent=
        `${node.label} · ${e.weight} ${T("tx")} · ${compact(e.amount)} ₸`;
      s.appendChild(c);
    });

    const hc=svgEl("circle",{cx,cy,r:26,fill:danger?"var(--block)":"var(--data)",
      "fill-opacity":.2,stroke:danger?"var(--block)":"var(--data-strong)","stroke-width":2});
    hc.appendChild(svgEl("title")).textContent=
      `${hub.type}: ${hub.label} · ${hub.clients} ${T("graph_clients")} · ${compact(hub.amount)} ₸`;
    s.appendChild(hc);
    s.appendChild(svgText(cx,cy+4,hub.clients,
      {"text-anchor":"middle",fill:"var(--text)","font-size":15,"font-weight":700}));
    s.appendChild(svgText(cx,cy-cellH/2+26,hub.type+" · "+hub.label,
      {"text-anchor":"middle",fill:"var(--text)","font-size":12,"font-weight":600}));
    s.appendChild(svgText(cx,cy-cellH/2+43,
      hub.clients+" "+T("graph_clients")+" · "+pct(hub.fraud_share,0)+" "+T("fraud_yes"),
      {"text-anchor":"middle","font-size":11}));
  });
  const sc=el("div",{class:"scroll"}); sc.appendChild(s); holder.appendChild(sc);
  holder.appendChild(el("div",{class:"lgd"},
    el("span",{html:'<i style="background:var(--data-strong)"></i>'+esc(T("graph_hub"))}),
    el("span",{html:'<i style="background:var(--data)"></i>'+esc(T("th_client"))}),
    el("span",{html:'<i style="background:var(--block)"></i>'+esc(T("fraud_yes"))})));
}

/* ---------------------------------------------------------------- карта */
async function viewMap(root){
  root.appendChild(el("h2",{},T("map_h")));
  root.appendChild(el("p",{class:"sub"},T("map_sub")));
  const holder=el("div",{class:"panel"});
  holder.appendChild(el("div",{class:"loading"},"…"));
  root.appendChild(holder);

  let m;
  try{ m = await cached("map","/api/map"); }
  catch(e){ holder.innerHTML=""; holder.appendChild(el("div",{class:"note"},T("err"))); return; }
  holder.innerHTML="";

  /* Казахстан и заграница рисуются отдельно. Иначе Лагос и Бангкок растягивают
     рамку так, что вся страна сжимается в пятно и карту невозможно читать. */
  const kz=m.points.filter(p=>!p.foreign);
  const abroad=m.points.filter(p=>p.foreign);

  if(kz.length){
    const lats=kz.map(p=>p.lat), lons=kz.map(p=>p.lon);
    const minLat=Math.min(...lats)-1.6, maxLat=Math.max(...lats)+1.6;
    const minLon=Math.min(...lons)-2.2, maxLon=Math.max(...lons)+2.2;
    /* Поправка на широту: градус долготы на 50-й параллели короче градуса широты */
    const kx=Math.cos((minLat+maxLat)/2*Math.PI/180);
    const W=980, pad=34;
    const spanX=(maxLon-minLon)*kx, spanY=(maxLat-minLat);
    const H=Math.round((W-2*pad)*spanY/spanX)+2*pad;
    const X=lon=>pad+(W-2*pad)*((lon-minLon)*kx)/spanX;
    const Y=lat=>pad+(H-2*pad)*(1-(lat-minLat)/spanY);

    const s=svgRoot(W,H);
    s.appendChild(svgEl("rect",{x:0,y:0,width:W,height:H,rx:12,fill:"var(--data-wash)"}));
    for(let lon=Math.ceil(minLon/5)*5; lon<maxLon; lon+=5)
      s.appendChild(svgEl("line",{x1:X(lon),x2:X(lon),y1:pad,y2:H-pad,
        stroke:"var(--line)","stroke-dasharray":"3 6"}));
    for(let lat=Math.ceil(minLat/3)*3; lat<maxLat; lat+=3)
      s.appendChild(svgEl("line",{x1:pad,x2:W-pad,y1:Y(lat),y2:Y(lat),
        stroke:"var(--line)","stroke-dasharray":"3 6"}));

    const maxTx=Math.max(...kz.map(p=>p.transactions),1);
    const sorted=[...kz].sort((a,b)=>b.transactions-a.transactions);
    /* Большие круги рисуем первыми, чтобы мелкие не тонули под ними */
    sorted.forEach(p=>{
      const r=7+30*Math.sqrt(p.transactions/maxTx);
      const hot=Math.min(p.fraud_rate/0.05,1);
      // от нейтральных чернил данных к цвету блокировки по доле фрода
      const color=`rgb(${Math.round(134+95*hot)},${Math.round(151-79*hot)},${Math.round(181-104*hot)})`;
      const c=svgEl("circle",{cx:X(p.lon),cy:Y(p.lat),r,fill:color,"fill-opacity":.4,
        stroke:color,"stroke-width":1.8});
      c.appendChild(svgEl("title")).textContent =
        `${p.city}: ${nf(p.transactions)} ${T("tx")} · ${compact(p.amount)} ₸ · `+
        `${T("fraud_yes")} ${p.fraud} (${pct(p.fraud_rate,2)}) · ${T("block")} ${p.blocked}`;
      s.appendChild(c);
    });
    /* Подписи — только крупнейшим городам, иначе они наезжают друг на друга */
    const placed=[];
    sorted.slice(0,9).forEach(p=>{
      const r=7+30*Math.sqrt(p.transactions/maxTx);
      const x=X(p.lon);
      let y=Y(p.lat)-r-7;
      while(placed.some(q=>Math.abs(q.x-x)<62 && Math.abs(q.y-y)<13)) y-=14;
      placed.push({x,y});
      const t=svgText(x,y,p.city,{"text-anchor":"middle",fill:"var(--text)","font-size":11.5});
      t.setAttribute("stroke","var(--bg)"); t.setAttribute("stroke-width","3.5");
      t.setAttribute("paint-order","stroke");
      s.appendChild(t);
    });
    const sc=el("div",{class:"scroll"}); sc.appendChild(s); holder.appendChild(sc);
    holder.appendChild(el("div",{class:"lgd"},
      el("span",{html:'<i style="background:rgb(134,151,181)"></i>'+esc(T("fraud_no"))}),
      el("span",{html:'<i style="background:rgb(229,72,77)"></i>'+esc(T("fraud_yes"))})));
  }

  /* Заграница: точек мало, но доля фрода в них совсем другая */
  if(abroad.length){
    const p2=el("div",{class:"panel",style:"margin-top:14px"},
      el("h3",{},T("map_abroad")), el("p",{class:"sub"},T("map_abroad_sub")));
    p2.appendChild(barsH(
      abroad.sort((a,b)=>b.fraud_rate-a.fraud_rate).map(p=>({
        label:p.city+" ("+p.country+")", value:p.fraud_rate,
        color:p.fraud_rate>0.3?"var(--block)":"var(--stepup)"})),
      {w:620,pad:180,barH:24,gap:7,fmt:v=>pct(v,1)}));
    root.appendChild(p2);
  }

  const tp=el("div",{class:"panel",style:"margin-top:14px"});
  const tbl=el("table",{});
  tbl.appendChild(el("thead",{},el("tr",{},
    el("th",{},T("th_place")),
    el("th",{class:"num"},T("tx")),
    el("th",{class:"num"},T("th_amount")),
    el("th",{class:"num"},T("fraud_yes")),
    el("th",{class:"num"},T("block")))));
  const tb=el("tbody",{});
  [...m.points].sort((a,b)=>b.transactions-a.transactions).slice(0,14)
    .forEach(p=>tb.appendChild(el("tr",{},
      el("td",{},p.city, p.foreign?el("span",{class:"dim",style:"font-size:11px"}," · "+p.country):null),
      el("td",{class:"num mono"},nf(p.transactions)),
      el("td",{class:"num mono"},compact(p.amount)+" ₸"),
      el("td",{class:"num mono"},p.fraud+" ("+pct(p.fraud_rate,2)+")"),
      el("td",{class:"num mono"},p.blocked))));
  tbl.appendChild(tb);
  const sc2=el("div",{class:"scroll"}); sc2.appendChild(tbl);
  tp.appendChild(sc2); root.appendChild(tp);
}

/* ---------------------------------------------------------------- модель */

/* Схема тракта. Рисуем не названия блоков, а именно то, что иначе пришлось бы
   собирать из текста: где расходятся два канала, чем они сходятся обратно и
   почему после слияния стоит ещё одна калибровка. */
function architectureDiagram(){
  const W=980,H=250;
  const s=svgRoot(W,H);
  s.setAttribute("role","img");
  s.setAttribute("aria-label", T("arch_alt"));

  const defs=svgEl("defs");
  const mk=(id,color)=>{
    const m=svgEl("marker",{id,viewBox:"0 0 10 10",refX:9,refY:5,
      markerWidth:7,markerHeight:7,orient:"auto-start-reverse"});
    m.appendChild(svgEl("path",{d:"M0,0 L10,5 L0,10 z",fill:color}));
    return m;
  };
  defs.appendChild(mk("ar","var(--muted)"));
  defs.appendChild(mk("ar2","var(--data-dim)"));
  defs.appendChild(mk("ar3","var(--hold)"));
  s.appendChild(defs);

  const box=(x,y,w,h,title,sub,color)=>{
    s.appendChild(svgEl("rect",{x,y,width:w,height:h,rx:11,
      fill:"var(--panel2)",stroke:color||"var(--line)","stroke-width":1.5}));
    s.appendChild(svgText(x+w/2,y+(sub?h/2-4:h/2+4),title,
      {"text-anchor":"middle",fill:"var(--text)","font-size":13,"font-weight":600}));
    if(sub) s.appendChild(svgText(x+w/2,y+h/2+14,sub,
      {"text-anchor":"middle","font-size":11}));
  };
  // Подпись ставится явной точкой, а не серединой отрезка: на диагональных
  // стрелках середина приходится вплотную к блоку, и текст налезает на рамку.
  const arrow=(x1,y1,x2,y2,marker,color,label)=>{
    s.appendChild(svgEl("line",{x1,y1,x2,y2,stroke:color||"var(--muted)",
      "stroke-width":1.6,"marker-end":`url(#${marker||"ar"})`}));
    if(label) s.appendChild(svgText(label.x,label.y,label.text,
      {"text-anchor":label.anchor||"end","font-size":10.5}));
  };

  box(0,95,132,58,T("arch_tx"),T("arch_tx_sub"));
  box(172,95,140,58,T("arch_features"),"51");
  // два канала
  box(360,28,182,58,T("arch_sup"),"LightGBM","var(--data)");
  box(360,162,182,58,T("arch_anom"),"Isolation Forest","var(--data-dim)");
  box(590,95,150,58,T("arch_merge"),T("arch_merge_sub"),"var(--hold)");
  box(790,95,190,58,T("arch_cost"),T("arch_cost_sub"),"var(--allow)");

  arrow(132,124,172,124);
  arrow(312,120,356,66,"ar","var(--data)",
        {x:352,y:52,text:T("arch_labels"),anchor:"end"});
  arrow(312,128,356,182,"ar2","var(--data-dim)",
        {x:352,y:200,text:T("arch_nolabels"),anchor:"end"});
  arrow(542,64,586,110,"ar","var(--data)");
  arrow(542,184,586,138,"ar2","var(--data-dim)");
  arrow(740,124,786,124,"ar3","var(--hold)");

  s.appendChild(svgText(665,176,T("arch_note"),
    {"text-anchor":"middle","font-size":10.5,fill:"var(--dim)"}));
  s.appendChild(svgText(885,176,T("arch_note2"),
    {"text-anchor":"middle","font-size":10.5,fill:"var(--dim)"}));

  const fig=el("figure",{style:"margin:0"});
  const sc=el("div",{class:"scroll"}); sc.appendChild(s); fig.appendChild(sc);
  fig.appendChild(el("figcaption",{class:"sub",style:"margin:10px 0 0"},T("arch_caption")));
  return fig;
}

/* Настоящая история обучения, а не иллюстрация */
function trainingCurve(curve){
  const ap=curve.average_precision||[];
  if(ap.length<3) return el("div",{class:"dim"},"—");
  const W=620,H=220,padL=46,padB=34,padT=14,padR=12;
  const s=svgRoot(W,H);
  const iw=W-padL-padR, ih=H-padT-padB;
  const lo=Math.min(...ap), hi=Math.max(...ap);
  const span=Math.max(hi-lo,1e-6);
  const X=i=>padL+iw*i/(ap.length-1);
  const Y=v=>padT+ih*(1-(v-lo)/span);

  for(let g=0;g<=4;g++){
    const y=padT+ih*g/4;
    s.appendChild(svgEl("line",{x1:padL,x2:W-padR,y1:y,y2:y,stroke:"var(--line)"}));
    s.appendChild(svgText(padL-8,y+4,(hi-span*g/4).toFixed(3),
      {"text-anchor":"end","font-size":10}));
  }
  s.appendChild(svgEl("polyline",{
    points:ap.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" "),
    fill:"none",stroke:"var(--data)","stroke-width":2}));

  const best=curve.best_iteration||0;
  if(best>0 && best<ap.length){
    s.appendChild(svgEl("line",{x1:X(best),x2:X(best),y1:padT,y2:padT+ih,
      stroke:"var(--allow)","stroke-dasharray":"4 4","stroke-width":1.5}));
    s.appendChild(svgText(X(best),padT-2,T("curve_best")+" "+best,
      {"text-anchor":"middle",fill:"var(--allow)","font-size":10.5,"font-weight":600}));
  }
  for(let i=0;i<ap.length;i+=Math.ceil(ap.length/6))
    s.appendChild(svgText(X(i),H-padB+18,String(i),{"text-anchor":"middle","font-size":10}));
  s.appendChild(svgText(padL,H-padB+32,T("curve_iter"),{"font-size":10.5}));
  return s;
}

async function viewModel(root){
  root.appendChild(el("h2",{},T("model_h")));
  root.appendChild(el("p",{class:"sub"},T("model_sub")));

  let rep={}, mt={};
  try{ [rep,mt] = await Promise.all([cached("report","/api/report"), cached("metrics","/api/metrics")]); }
  catch(e){ root.appendChild(el("div",{class:"note"},T("err"))); return; }

  /* архитектура */
  const pA=el("div",{class:"panel"},el("h3",{},T("arch_h")));
  pA.appendChild(architectureDiagram());
  root.appendChild(pA);

  /* кривая обучения */
  const two=el("div",{class:"grid",style:"grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:14px;margin-top:14px"});
  const pC=el("div",{class:"panel"},el("h3",{},T("curve_h2")),el("p",{class:"sub"},T("curve_sub2")));
  pC.appendChild(trainingCurve(mt.training_curve||{}));
  two.appendChild(pC);

  /* абляция */
  const ab=rep.ablation;
  const pB=el("div",{class:"panel"},el("h3",{},T("abl_h")),el("p",{class:"sub"},T("abl_sub")));
  if(ab){
    const t=el("table",{});
    t.appendChild(el("thead",{},el("tr",{},
      el("th",{},T("abl_variant")), el("th",{class:"num"},T("abl_n")),
      el("th",{class:"num"},"PR-AUC"), el("th",{class:"num"},T("abl_r90")))));
    const tb=el("tbody",{});
    ab.variants.forEach((v,i)=>tb.appendChild(el("tr",{},
      el("td",{style:i?"color:var(--allow);font-weight:600":""},v.name),
      el("td",{class:"num mono"},v.n_features),
      el("td",{class:"num mono"},v.pr_auc.toFixed(4)),
      el("td",{class:"num mono"},v.recall_at_precision90.toFixed(3)))));
    t.appendChild(tb);
    const sc=el("div",{class:"scroll"}); sc.appendChild(t); pB.appendChild(sc);
  } else pB.appendChild(el("div",{class:"dim"},T("no_report")));
  two.appendChild(pB);
  root.appendChild(two);

  /* скользящая валидация */
  let wf={};
  try{ wf = await cached("walkforward","/api/walkforward"); }catch(_){}
  if(wf.summary){
    const sm=wf.summary;
    const pW=el("div",{class:"panel",style:"margin-top:14px"},
      el("h3",{},T("wf_h")), el("p",{class:"sub"},T("wf_sub")));
    const t=el("table",{});
    t.appendChild(el("thead",{},el("tr",{},
      el("th",{},T("wf_fold")), el("th",{},T("wf_window")),
      el("th",{class:"num"},T("wf_train")), el("th",{class:"num"},T("wf_fraud")),
      el("th",{class:"num"},"PR-AUC"), el("th",{class:"num"},T("abl_r90")))));
    const tb=el("tbody",{});
    (wf.folds_detail||[]).forEach(f=>tb.appendChild(el("tr",{},
      el("td",{class:"mono"},String(f.fold)),
      el("td",{class:"dim",style:"font-size:12px"},f.test_from+" — "+f.test_to),
      el("td",{class:"num mono dim"},nf(f.rows_train)),
      el("td",{class:"num mono dim"},f.fraud_in_test),
      el("td",{class:"num mono"},f.pr_auc.toFixed(4)),
      el("td",{class:"num mono"},f.recall_at_precision90.toFixed(3)))));
    tb.appendChild(el("tr",{style:"border-top:1px solid var(--line)"},
      el("td",{style:"font-weight:600"},T("wf_median")), el("td",{}),
      el("td",{class:"num"}), el("td",{class:"num mono dim"},sm.fraud_total_in_tests),
      el("td",{class:"num mono",style:"font-weight:700"},
        sm.pr_auc.median.toFixed(4)+"  ["+sm.pr_auc.min.toFixed(3)+"–"+sm.pr_auc.max.toFixed(3)+"]"),
      el("td",{class:"num mono",style:"font-weight:700"},
        sm.recall_at_precision90.median.toFixed(3))));
    t.appendChild(tb);
    const sc=el("div",{class:"scroll"}); sc.appendChild(t); pW.appendChild(sc);
    pW.appendChild(el("div",{class:"note",style:"margin-top:14px"},
      T("wf_note").replace("{n}", String(sm.fraud_total_in_tests))));
    root.appendChild(pW);
  }

  /* устойчивость к ошибке в стоимостной модели */
  const sens=rep.sensitivity;
  if(sens){
    const pS2=el("div",{class:"panel",style:"margin-top:14px"},
      el("h3",{},T("sens_h")), el("p",{class:"sub"},T("sens_sub")));
    const t=el("table",{});
    t.appendChild(el("thead",{},el("tr",{},
      el("th",{},T("sens_param")), el("th",{class:"num"},T("sens_changed")),
      el("th",{class:"num"},T("sens_regret")))));
    const tb=el("tbody",{});
    sens.variants.forEach(v=>tb.appendChild(el("tr",{},
      el("td",{},v.parameter),
      el("td",{class:"num mono"},pct(v.changed_share,1)),
      el("td",{class:"num mono",style:"color:"+(v.regret_share>0.05?"var(--block)":"var(--allow)")},
        pct(v.regret_share,2)))));
    t.appendChild(tb);
    const sc=el("div",{class:"scroll"}); sc.appendChild(t); pS2.appendChild(sc);
    pS2.appendChild(el("div",{class:"note",style:"margin-top:14px"},T("sens_note")));
    root.appendChild(pS2);
  }

  /* незнакомая схема — главный аргумент */
  const nv=rep.novel_scheme;
  const pN=el("div",{class:"panel",style:"margin-top:14px"},
    el("h3",{},T("novel_h")), el("p",{class:"sub"},T("novel_sub")));
  if(nv){
    const t=el("table",{});
    t.appendChild(el("thead",{},el("tr",{},
      el("th",{},T("novel_hidden")), el("th",{class:"num"},T("novel_n")),
      el("th",{class:"num"},T("novel_sup")), el("th",{class:"num"},T("novel_anom")),
      el("th",{class:"num"},T("novel_both")), el("th",{class:"num"},T("novel_spread")))));
    const tb=el("tbody",{});
    nv.results.forEach(r=>{
      const gain = r.blended_recall - r.supervised_recall;
      tb.appendChild(el("tr",{},
        el("td",{},T(r.hidden)),
        el("td",{class:"num mono dim"},r.n_hidden_in_test),
        el("td",{class:"num mono"},pct(r.supervised_recall,1)),
        el("td",{class:"num mono dim"},pct(r.anomaly_recall,1)),
        el("td",{class:"num mono",style:"font-weight:700;color:"+(gain>0?"var(--allow)":"var(--block)")},
          pct(r.blended_recall,1)+" ("+(gain>0?"+":"")+(gain*100).toFixed(1)+")"),
        el("td",{class:"num mono dim",style:"font-size:11.5px"},
          r.blended_recall_spread
            ? pct(r.blended_recall_spread.min,1)+"–"+pct(r.blended_recall_spread.max,1)
            : "—")));
    });
    t.appendChild(tb);
    const sc=el("div",{class:"scroll"}); sc.appendChild(t); pN.appendChild(sc);
    pN.appendChild(el("div",{class:"note",style:"margin-top:14px"},T("novel_note")));
  } else pN.appendChild(el("div",{class:"dim"},T("no_report")));
  root.appendChild(pN);

  /* задержка */
  let bench={};
  try{ bench = await cached("bench","/api/bench"); }catch(_){}
  if(bench.stages){
    const pL=el("div",{class:"panel",style:"margin-top:14px"},
      el("h3",{},T("lat_h")), el("p",{class:"sub"},T("lat_sub")));
    const t=el("table",{});
    t.appendChild(el("thead",{},el("tr",{},
      el("th",{},T("lat_stage")), el("th",{class:"num"},"p50"),
      el("th",{class:"num"},"p95"), el("th",{class:"num"},"p99"))));
    const tb=el("tbody",{});
    Object.entries(bench.stages).forEach(([name,v])=>{
      const total = name==="всего";
      tb.appendChild(el("tr",{style:total?"background:rgba(34,197,94,.07)":""},
        el("td",{style:total?"font-weight:700;color:var(--allow)":""},name),
        el("td",{class:"num mono",style:total?"font-weight:700":""},v.p50.toFixed(2)+" мс"),
        el("td",{class:"num mono"},v.p95.toFixed(2)+" мс"),
        el("td",{class:"num mono dim"},v.p99.toFixed(2)+" мс")));
    });
    t.appendChild(tb);
    const sc=el("div",{class:"scroll"}); sc.appendChild(t); pL.appendChild(sc);
    pL.appendChild(el("div",{class:"note",style:"margin-top:14px"},
      T("lat_note").replace("{n}", nf(bench.throughput_per_hour))));
    root.appendChild(pL);
  }

  /* дрейф */
  let drift={};
  try{ drift = await cached("drift","/api/drift"); }catch(_){}
  if(drift.feature_psi){
    const pD=el("div",{class:"panel",style:"margin-top:14px"},
      el("h3",{},T("drift_h")), el("p",{class:"sub"},T("drift_sub")));

    const c=drift.counts||{};
    const sum=el("div",{class:"pills",style:"margin:0 0 14px"});
    const chip=(label,n,color)=>sum.appendChild(el("span",{class:"pill"},
      el("span",{class:"d",style:"background:"+color}), el("b",{},String(n)), " ", label));
    chip(T("drift_stable"), c.stable||0, "var(--allow)");
    chip(T("drift_moderate"), c.moderate||0, "var(--stepup)");
    chip(T("drift_significant"), c.significant||0, "var(--block)");
    pD.appendChild(sum);

    const t=el("table",{});
    t.appendChild(el("thead",{},el("tr",{},
      el("th",{},T("drift_feature")), el("th",{class:"num"},"PSI"),
      el("th",{},T("drift_verdict")))));
    const tb=el("tbody",{});
    drift.feature_psi.slice(0,8).forEach(r=>{
      const color = r.accumulating ? "var(--dim)"
        : r.verdict==="significant" ? "var(--block)"
        : r.verdict==="moderate" ? "var(--stepup)" : "var(--allow)";
      tb.appendChild(el("tr",{},
        el("td",{class:"mono",style:"font-size:12.5px"},r.feature),
        el("td",{class:"num mono",style:"color:"+color},r.psi.toFixed(4)),
        el("td",{style:"font-size:12px;color:var(--muted)"},
          r.accumulating ? T("drift_warmup") : T("drift_"+r.verdict))));
    });
    t.appendChild(tb);
    const sc=el("div",{class:"scroll"}); sc.appendChild(t); pD.appendChild(sc);
    pD.appendChild(el("div",{class:"note",style:"margin-top:14px"},T("drift_note")));

    if((drift.calibration||[]).length){
      pD.appendChild(el("h3",{style:"margin-top:18px"},T("drift_cal_h")));
      pD.appendChild(el("p",{class:"sub"},T("drift_cal_sub")));
      const t2=el("table",{});
      t2.appendChild(el("thead",{},el("tr",{},
        el("th",{},T("drift_week")), el("th",{class:"num"},T("tx")),
        el("th",{class:"num"},T("drift_pred")), el("th",{class:"num"},T("drift_act")),
        el("th",{class:"num"},T("drift_gap")))));
      const tb2=el("tbody",{});
      drift.calibration.forEach(w=>tb2.appendChild(el("tr",{},
        el("td",{class:"mono"},w.period),
        el("td",{class:"num mono dim"},nf(w.count)),
        el("td",{class:"num mono"},w.predicted.toFixed(4)),
        el("td",{class:"num mono"},w.actual.toFixed(4)),
        el("td",{class:"num mono",style:"color:"+(Math.abs(w.gap)>0.01?"var(--block)":"var(--allow)")},
          (w.gap>0?"+":"")+w.gap.toFixed(4)))));
      t2.appendChild(tb2);
      const sc2=el("div",{class:"scroll"}); sc2.appendChild(t2); pD.appendChild(sc2);
    }
    root.appendChild(pD);
  }

  /* нагрузка на операторов */
  let cap={};
  try{ cap = await cached("capacity","/api/capacity"); }catch(_){}
  if(cap.holds){
    const pC2=el("div",{class:"panel",style:"margin-top:14px"},
      el("h3",{},T("cap2_h")), el("p",{class:"sub"},T("cap2_sub")));

    const nums=el("div",{class:"kpis",style:"margin:0 0 18px"});
    const tile=(label,value,note)=>nums.appendChild(el("div",{class:"kpi"},
      el("div",{class:"k"},label), el("div",{class:"v"},value),
      note?el("div",{class:"n"},note):null));
    tile(T("cap2_calls"), nf(cap.monthly_calls), T("cap2_per_month"));
    tile(T("cap2_ops"), String(cap.monthly_operators), 
         T("cap2_shift").replace("{n}", String(cap.calls_per_operator_shift)));
    tile(T("cap2_peak"), cap.peak_calls_per_hour+"/ч", cap.peak_hour+":00");
    tile(T("cap2_value"), compact(cap.saving_per_call)+" ₸", T("cap2_vs_cost"));
    pC2.appendChild(nums);

    /* Концентрация выгоды: сколько денег лежит в верхушке очереди */
    const W=620,H=200,padL=44,padB=36,padT=12;
    const sv=svgRoot(W,H), iw=W-padL-14, ih=H-padT-padB;
    const X=v=>padL+iw*v, Y=v=>padT+ih*(1-v);
    for(let g=0;g<=4;g++){
      sv.appendChild(svgEl("line",{x1:padL,x2:W-14,y1:Y(g/4),y2:Y(g/4),stroke:"var(--line)"}));
      sv.appendChild(svgText(padL-8,Y(g/4)+4,(g*25)+"%",{"text-anchor":"end","font-size":10}));
    }
    sv.appendChild(svgEl("line",{x1:X(0),y1:Y(0),x2:X(1),y2:Y(1),
      stroke:"var(--dim)","stroke-dasharray":"4 4"}));
    sv.appendChild(svgEl("polyline",{
      points:cap.capacity_curve.map(c=>`${X(c.share_of_calls).toFixed(1)},${Y(c.share_of_value).toFixed(1)}`).join(" "),
      fill:"none",stroke:"var(--text)","stroke-width":2}));
    cap.capacity_curve.forEach(c=>{
      const dot=svgEl("circle",{cx:X(c.share_of_calls),cy:Y(c.share_of_value),r:3,fill:"var(--text)"});
      dot.appendChild(svgEl("title")).textContent =
        `${T("cap2_top")} ${(c.share_of_calls*100).toFixed(0)}% (${c.calls}) -> ${(c.share_of_value*100).toFixed(1)}%`;
      sv.appendChild(dot);
    });
    for(let g=0;g<=4;g++)
      sv.appendChild(svgText(X(g/4),H-padB+18,(g*25)+"%",{"text-anchor":"middle","font-size":10}));
    sv.appendChild(svgText(padL,H-padB+32,T("cap2_x"),{"font-size":10.5}));
    const sc=el("div",{class:"scroll"}); sc.appendChild(sv); pC2.appendChild(sc);
    const top=cap.capacity_curve.find(c=>Math.abs(c.share_of_calls-0.2)<1e-6);
    pC2.appendChild(el("div",{class:"note",style:"margin-top:12px"},
      T("cap2_note").replace("{v}", top ? pct(top.share_of_value,0) : "—")));
    root.appendChild(pC2);
  }

  /* цена страховки */
  const cs=rep.cap_sweep;
  if(cs){
    const pS=el("div",{class:"panel",style:"margin-top:14px"},
      el("h3",{},T("cap_h")), el("p",{class:"sub"},T("cap_sub")));
    const t=el("table",{});
    t.appendChild(el("thead",{},el("tr",{},
      el("th",{},T("cap_cap")), el("th",{class:"num"},T("cap_known")),
      el("th",{class:"num"},T("cap_novel")))));
    const tb=el("tbody",{});
    cs.rows.forEach(r=>{
      const chosen = r.cap === cs.chosen;
      tb.appendChild(el("tr",{style:chosen?"background:rgba(34,197,94,.07)":""},
        el("td",{style:chosen?"font-weight:700;color:var(--allow)":""},
          r.cap===null?T("cap_off"):r.cap.toFixed(2)),
        el("td",{class:"num mono"},r.pr_auc_known.toFixed(4)),
        el("td",{class:"num mono",style:chosen?"font-weight:700":""},
          pct(r.novel_recall,1)
          + (r.novel_recall_spread
              ? "  ["+pct(r.novel_recall_spread.min,0)+"–"+pct(r.novel_recall_spread.max,0)+"]"
              : ""))));
    });
    t.appendChild(tb);
    const sc=el("div",{class:"scroll"}); sc.appendChild(t); pS.appendChild(sc);
    root.appendChild(pS);
  }
}

/* ---------------------------------------------------------------- экономика */
const ECON_FIELDS=[
  ["case_handling_cost",     {ru:"Разбор одного случая фрода",   kk:"Бір алаяқтық жағдайын талдау", en:"Handling one fraud case"},            0, 30000, 500],
  ["hold_op_cost",           {ru:"Звонок оператора",              kk:"Оператор қоңырауы",            en:"Operator call"},                       0, 100000, 500],
  ["hold_friction_rate",     {ru:"Ущерб от задержки, доля суммы", kk:"Кідірістен зиян, сома үлесі",  en:"Delay damage, share of amount"},       0, 0.05, 0.001],
  ["step_up_friction_rate",  {ru:"Трение подтверждения, доля",    kk:"Растау кедергісі, үлес",       en:"Confirmation friction, share"},        0, 0.02, 0.0005],
  ["block_churn_rate",       {ru:"Риск ухода после блокировки",   kk:"Бұғаттаудан кейін кету қаупі", en:"Churn risk after a false block"},      0, 0.5,  0.01],
  ["lgd_transfer",           {ru:"Невозвратность перевода",       kk:"Аударымның қайтарымсыздығы",   en:"Loss given fraud, transfers"},         0, 1,    0.01],
];

async function viewEconomics(root){
  root.appendChild(el("h2",{},T("econ_h")));
  root.appendChild(el("p",{class:"sub"},T("econ_sub")));

  let econ;
  try{ econ = await cached("econ","/api/economics"); }
  catch(e){ root.appendChild(el("div",{class:"note"},T("err"))); return; }

  const panel=el("div",{class:"panel"});
  const grid=el("div",{class:"grid",style:"grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:18px"});
  const current=Object.assign({},SIM.econ||{});

  ECON_FIELDS.forEach(([key,label,min,max,step])=>{
    const val=(current[key]!==undefined)?current[key]:econ[key];
    const d=el("div",{});
    const out=el("span",{class:"mono",style:"color:var(--text);float:right"},
      step<1?Number(val).toFixed(4).replace(/0+$/,"").replace(/\.$/,""):nf(val));
    d.appendChild(el("label",{},label[LANG]||label.ru,out));
    const r=el("input",{type:"range",min,max,step,value:val});
    r.addEventListener("input",()=>{
      current[key]=Number(r.value);
      out.textContent = step<1
        ? Number(r.value).toFixed(4).replace(/0+$/,"").replace(/\.$/,"")
        : nf(r.value);
    });
    d.appendChild(r);
    grid.appendChild(d);
  });
  panel.appendChild(grid);

  if(IS_STATIC()){
    panel.appendChild(el("div",{class:"note",style:"margin-top:16px"},T("static_note_econ")));
  }else{
    const row=el("div",{style:"display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"});
    const apply=el("button",{class:"btn"},T("sim_run"));
    apply.addEventListener("click",()=>{ SIM.econ=Object.assign({},current); go("sim"); });
    const reset=el("button",{class:"btn ghost"},T("econ_reset"));
    reset.addEventListener("click",()=>{ SIM.econ=null; go("econ"); });
    row.appendChild(apply); row.appendChild(reset);
    panel.appendChild(row);
  }
  root.appendChild(panel);

  /* матрица эффективности — сердце стоимостной модели */
  const eff=econ.effectiveness||{};
  const p2=el("div",{class:"panel",style:"margin-top:14px"},
    el("h3",{},T("econ_eff")), el("p",{class:"sub"},T("econ_eff_sub")));
  const kinds=["stolen_card","social_eng","fraud_ring"];
  const tbl=el("table",{});
  tbl.appendChild(el("thead",{},el("tr",{},
    el("th",{},""), ...kinds.map(k=>el("th",{class:"num"},T(k))))));
  const tb=el("tbody",{});
  ["step_up","hold","block"].forEach(a=>{
    tb.appendChild(el("tr",{},
      el("td",{},el("span",{class:"badge b-"+a},T(a))),
      ...kinds.map(k=>{
        const v=(eff[a]||{})[k]||0;
        const strong=v>=0.8, weak=v<0.3;
        return el("td",{class:"num mono",
          style:"font-weight:600;color:"+(strong?"var(--allow)":weak?"var(--block)":"var(--stepup)")},
          pct(v,0));
      })));
  });
  tbl.appendChild(tb);
  const sc=el("div",{class:"scroll"}); sc.appendChild(tbl); p2.appendChild(sc);
  root.appendChild(p2);
}
</script>

<script>
"use strict";
/* ======================================================================
   Маршрутизация и запуск
   ====================================================================== */

const VIEWS = [
  ["dash",  "nav_dash",  viewDashboard],
  ["sim",   "nav_sim",   viewSimulator],
  ["model", "nav_model", viewModel],
  ["feed",  "nav_feed",  viewFeed],
  ["graph", "nav_graph", viewGraph],
  ["map",   "nav_map",   viewMap],
  ["econ",  "nav_econ",  viewEconomics],
];

let CURRENT = "dash";

function renderNav(){
  const nav=$("#nav"); nav.innerHTML="";
  VIEWS.forEach(([key,labelKey])=>{
    const b=el("button",{class:key===CURRENT?"on":""},T(labelKey));
    b.addEventListener("click",()=>go(key));
    nav.appendChild(b);
  });
  document.querySelectorAll("[data-i]").forEach(n=>{ n.textContent=T(n.dataset.i); });
  document.documentElement.lang = LANG==="kk" ? "kk" : LANG;
}

function go(key){
  if(TICKER){ clearInterval(TICKER); TICKER=null; }
  CURRENT=key;
  if(location.hash.slice(1)!==key) history.replaceState(null,"","#"+key);
  renderNav();
  const root=$("#view"); root.innerHTML="";
  const view=(VIEWS.find(v=>v[0]===key)||VIEWS[0])[2];
  Promise.resolve(view(root)).catch(e=>{
    root.innerHTML="";
    root.appendChild(el("div",{class:"note"},T("err")+": "+e.message));
  });
}

function setLang(l){
  LANG=l;
  try{ localStorage.setItem("fh_lang", l); }catch(_){}
  document.querySelectorAll("#langs button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));
  go(CURRENT);
}

document.querySelectorAll("#langs button").forEach(b=>
  b.addEventListener("click",()=>setLang(b.dataset.l)));

window.addEventListener("hashchange",()=>{
  const k=location.hash.slice(1);
  if(k && k!==CURRENT && VIEWS.some(v=>v[0]===k)) go(k);
});

(function start(){
  let saved=null;
  try{ saved=localStorage.getItem("fh_lang"); }catch(_){}
  if(saved && I18N[saved]) LANG=saved;
  document.querySelectorAll("#langs button").forEach(b=>b.classList.toggle("on",b.dataset.l===LANG));
  const hash=location.hash.slice(1);
  go(VIEWS.some(v=>v[0]===hash) ? hash : "dash");
})();
</script>
</body>
</html>
